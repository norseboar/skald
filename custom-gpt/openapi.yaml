openapi: 3.1.0
info:
  title: Skald GitHub API Wrapper
  description: API wrapper for GitHub Content API operations - allows listing directories, getting file contents, creating/updating files, creating folders, and deleting files
  version: 1.0.0
servers:
  - url: https://skald-mu.vercel.app
    description: Production server
paths:
  /api/repos/contents:
    get:
      summary: List directory or get file contents
      description: Retrieves either a directory listing or the contents of a specific file from a GitHub repository
      operationId: getContents
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: File or directory path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success - returns directory listing array or file content object
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        sha:
                          type: string
                        size:
                          type: integer
                        type:
                          type: string
                          enum: [file, dir]
                        url:
                          type: string
                        html_url:
                          type: string
                        git_url:
                          type: string
                        download_url:
                          type: string
                          nullable: true
                  - type: object
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                      sha:
                        type: string
                      size:
                        type: integer
                      content:
                        type: string
                        description: File contents as plain text (decoded from base64)
                      encoding:
                        type: string
                      url:
                        type: string
                      html_url:
                        type: string
                      git_url:
                        type: string
                      download_url:
                        type: string
                        nullable: true
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: File or directory not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      summary: Create new file or replace entire file content
      description: Creates a new file or replaces the entire contents of an existing file in a GitHub repository. **Recommended for creating new files.** For updating existing files with partial changes, use the PATCH endpoint instead (more efficient). The API automatically handles SHA for updates. File size is limited to 100 MB (files exceeding this limit will be rejected).
      operationId: createOrUpdateFile
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - message
              properties:
                content:
                  type: string
                  description: File contents as plain text (will be base64 encoded automatically). Must not exceed 100 MB.
                message:
                  type: string
                  description: Commit message describing the change
      responses:
        '200':
          description: Success - file created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: object
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                      sha:
                        type: string
                      size:
                        type: integer
                      content:
                        type: string
                        description: File contents as plain text (decoded from base64)
                      encoding:
                        type: string
                      url:
                        type: string
                      html_url:
                        type: string
                      git_url:
                        type: string
                      download_url:
                        type: string
                        nullable: true
                  commit:
                    type: object
                    properties:
                      sha:
                        type: string
                      message:
                        type: string
                      author:
                        type: object
                        properties:
                          name:
                            type: string
                          email:
                            type: string
                          date:
                            type: string
        '400':
          description: Bad request - missing or invalid parameters, or file size exceeds 100 MB limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string
                    description: Additional error details (e.g., file size information)
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    patch:
      summary: Apply partial changes using text edits
      description: Applies partial changes to an existing file using LSP (Language Server Protocol) TextEdit format. **Recommended for updating existing files.** Retrieves the current file, applies the edits, and commits the changes. For creating new files, use the PUT endpoint instead. File size is limited to 100 MB (files exceeding this limit will be rejected). For files larger than 1 MB, the API automatically uses GitHub's raw media type for efficient retrieval.
      operationId: applyTextEdits
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - edits
                - message
              properties:
                edits:
                  type: array
                  description: Array of text edits to apply (LSP TextEdit format)
                  minItems: 1
                  items:
                    type: object
                    required:
                      - range
                      - newText
                    properties:
                      range:
                        type: object
                        required:
                          - start
                          - end
                        properties:
                          start:
                            type: object
                            required:
                              - line
                              - character
                            properties:
                              line:
                                type: integer
                                minimum: 0
                                description: Starting line number (0-based)
                              character:
                                type: integer
                                minimum: 0
                                description: Starting character position (0-based)
                          end:
                            type: object
                            required:
                              - line
                              - character
                            properties:
                              line:
                                type: integer
                                minimum: 0
                                description: Ending line number (0-based)
                              character:
                                type: integer
                                minimum: 0
                                description: Ending character position (0-based)
                      newText:
                        type: string
                        description: Text to replace the range with (can be empty string for deletion)
                message:
                  type: string
                  description: Commit message describing the changes
      responses:
        '200':
          description: Success - edits applied and file updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: object
                    properties:
                      name:
                        type: string
                      path:
                        type: string
                      sha:
                        type: string
                      size:
                        type: integer
                      content:
                        type: string
                        description: File contents as plain text (decoded from base64)
                      encoding:
                        type: string
                      url:
                        type: string
                      html_url:
                        type: string
                      git_url:
                        type: string
                      download_url:
                        type: string
                        nullable: true
                  commit:
                    type: object
                    properties:
                      sha:
                        type: string
                      message:
                        type: string
                      author:
                        type: object
                        properties:
                          name:
                            type: string
                          email:
                            type: string
                          date:
                            type: string
        '400':
          description: Bad request - missing or invalid parameters, invalid edits, file size exceeds 100 MB limit, or edits reference out-of-bounds ranges
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string
                    description: Additional error details (e.g., file size information or edit validation errors)
                  message:
                    type: string
                    description: Detailed error message
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: object
                    description: Additional error details from GitHub API
        '500':
          description: Internal server error - failed to retrieve or process file content
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
    post:
      summary: Create folder
      description: Creates a new folder in a GitHub repository by creating a .gitkeep file (GitHub doesn't support empty directories)
      operationId: createFolder
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Folder path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Commit message describing the folder creation
      responses:
        '200':
          description: Success - folder created
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Path of the created folder
                  message:
                    type: string
                    description: Confirmation message
                  content:
                    type: object
                    description: Information about the created .gitkeep file
                  commit:
                    type: object
                    description: Commit information
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete file
      description: Deletes a file from a GitHub repository. Requires the file SHA obtained from a GET request.
      operationId: deleteFile
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - sha
              properties:
                message:
                  type: string
                  description: Commit message describing the deletion
                sha:
                  type: string
                  description: File SHA obtained from a GET request of the file
      responses:
        '200':
          description: Success - file deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    type: object
                    description: Commit information for the deletion
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: API key passed as Bearer token in Authorization header

