# NOTE: OpenAPI operation descriptions must be <= 300 characters for OpenAI Custom GPT compatibility
# Check all operation descriptions when adding new endpoints or updating existing ones

openapi: 3.1.0
info:
  title: Skald GitHub API Wrapper
  description: API wrapper for GitHub Content API operations - allows listing directories, getting file contents, creating/updating files, applying partial edits, creating folders, and deleting files
  version: 1.0.0
servers:
  - url: https://skald-mu.vercel.app
    description: Production server
paths:
  /api/repos/contents:
    get:
      summary: List directory or get file contents
      description: Retrieves either a directory listing (array) or the contents of a specific file from a GitHub repository. File content is automatically decoded from base64.
      operationId: getContents
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
            pattern: '^[^/]+/[^/]+$'
        - name: path
          in: query
          required: true
          description: File or directory path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success - returns directory listing array or file content object
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    description: Directory listing (array of items)
                    items:
                      $ref: '#/components/schemas/GitHubContentItem'
                  - $ref: '#/components/schemas/GitHubFileContent'
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File or directory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Create new file or replace entire file content
      description: "Creates a new file or replaces entire contents of an existing file. Recommended for creating new files. Handles SHA automatically. File size limit: 100 MB."
      operationId: createOrUpdateFile
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
            pattern: '^[^/]+/[^/]+$'
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - message
              properties:
                content:
                  type: string
                  description: File contents as plain text (will be base64 encoded automatically). Must not exceed 100 MB.
                message:
                  type: string
                  description: Commit message describing the change
      responses:
        '200':
          description: Success - file created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubCreateUpdateResponse'
        '201':
          description: Success - file created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubCreateUpdateResponse'
        '400':
          description: Bad request - missing or invalid parameters, or file size exceeds 100 MB limit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      details:
                        type: string
                        description: Additional error details (e.g., file size information)
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Apply partial changes using text edits
      description: "Applies partial changes to an existing file using LSP TextEdit format. Recommended for updating existing files. Use PUT for creating new files. Retrieves file, applies edits, commits. File size limit: 100 MB. Uses raw media type for files > 1 MB."
      operationId: applyTextEdits
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
            pattern: '^[^/]+/[^/]+$'
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - edits
                - message
              properties:
                edits:
                  type: array
                  description: Array of text edits to apply (LSP TextEdit format)
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/TextEdit'
                message:
                  type: string
                  description: Commit message describing the changes
      responses:
        '200':
          description: Success - edits applied and file updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubCreateUpdateResponse'
        '400':
          description: Bad request - missing or invalid parameters, invalid edits, file size exceeds 100 MB limit, or edits reference out-of-bounds ranges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      details:
                        type: string
                        description: Additional error details (e.g., file size information or edit validation errors)
                      message:
                        type: string
                        description: Detailed error message
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      details:
                        type: object
                        description: Additional error details from GitHub API
        '500':
          description: Internal server error - failed to retrieve or process file content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        description: Detailed error message
    post:
      summary: Create folder
      description: Creates a new folder in a GitHub repository by creating a .gitkeep file (GitHub doesn't support empty directories)
      operationId: createFolder
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
            pattern: '^[^/]+/[^/]+$'
        - name: path
          in: query
          required: true
          description: Folder path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Commit message describing the folder creation
      responses:
        '200':
          description: Success - folder created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GitHubCreateUpdateResponse'
                  - type: object
                    properties:
                      path:
                        type: string
                        description: Path of the created folder
                      message:
                        type: string
                        description: Confirmation message
        '201':
          description: Success - folder created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GitHubCreateUpdateResponse'
                  - type: object
                    properties:
                      path:
                        type: string
                        description: Path of the created folder
                      message:
                        type: string
                        description: Confirmation message
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete file
      description: Deletes a file from a GitHub repository. Requires the file SHA obtained from a GET request.
      operationId: deleteFile
      x-openai-isUserConfirmationRequired: false
      parameters:
        - name: repo
          in: query
          required: true
          description: Repository in format owner/repo (e.g., username/repo-name)
          schema:
            type: string
            pattern: '^[^/]+/[^/]+$'
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (defaults to 'main')
          schema:
            type: string
            default: main
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - sha
              properties:
                message:
                  type: string
                  description: Commit message describing the deletion
                sha:
                  type: string
                  description: File SHA obtained from a GET request of the file
      responses:
        '200':
          description: Success - file deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    $ref: '#/components/schemas/GitHubCommit'
                  content:
                    type: object
                    nullable: true
                    description: May be null on successful deletion
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - repository not in allowed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API key passed as Bearer token in Authorization header
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details (optional)
        message:
          type: string
          description: Detailed error message (optional)
    GitHubContentItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the file or directory
        path:
          type: string
          description: Path relative to repository root
        sha:
          type: string
          description: Git blob SHA
        size:
          type: integer
          description: File size in bytes
        url:
          type: string
          format: uri
          description: GitHub API URL
        html_url:
          type: string
          format: uri
          description: GitHub web URL
        git_url:
          type: string
          format: uri
          description: Git URL
        download_url:
          type: string
          format: uri
          nullable: true
          description: Direct download URL (null for directories)
        type:
          type: string
          enum:
            - file
            - dir
          description: Type of item (file or directory)
    GitHubFileContent:
      type: object
      properties:
        content:
          type: string
          description: File contents as plain text (decoded from base64)
        encoding:
          type: string
          description: Content encoding (typically 'base64' before decoding)
        sha:
          type: string
          description: Git blob SHA
        size:
          type: integer
          description: File size in bytes
        url:
          type: string
          format: uri
          description: GitHub API URL
        html_url:
          type: string
          format: uri
          description: GitHub web URL
        git_url:
          type: string
          format: uri
          description: Git URL
        download_url:
          type: string
          format: uri
          nullable: true
          description: Direct download URL
    GitHubCreateUpdateResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/GitHubFileContent'
        commit:
          $ref: '#/components/schemas/GitHubCommit'
    GitHubCommit:
      type: object
      properties:
        sha:
          type: string
          description: Commit SHA
        node_id:
          type: string
          description: GitHub node ID
        url:
          type: string
          format: uri
          description: GitHub API URL
        html_url:
          type: string
          format: uri
          description: GitHub web URL
        author:
          $ref: '#/components/schemas/GitHubCommitAuthor'
        committer:
          $ref: '#/components/schemas/GitHubCommitAuthor'
        message:
          type: string
          description: Commit message
        tree:
          type: object
          properties:
            sha:
              type: string
            url:
              type: string
              format: uri
        parents:
          type: array
          items:
            type: object
            properties:
              sha:
                type: string
              url:
                type: string
                format: uri
              html_url:
                type: string
                format: uri
    GitHubCommitAuthor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        date:
          type: string
          format: date-time
    TextEdit:
      type: object
      required:
        - range
        - newText
      description: LSP TextEdit format for partial file edits
      properties:
        range:
          $ref: '#/components/schemas/TextEditRange'
        newText:
          type: string
          description: Text to replace the range with (can be empty string for deletion)
    TextEditRange:
      type: object
      required:
        - start
        - end
      description: Range of text to edit (0-based line and character positions)
      properties:
        start:
          $ref: '#/components/schemas/TextPosition'
        end:
          $ref: '#/components/schemas/TextPosition'
    TextPosition:
      type: object
      required:
        - line
        - character
      description: Text position (0-based)
      properties:
        line:
          type: integer
          minimum: 0
          description: Line number (0-based, first line is 0)
        character:
          type: integer
          minimum: 0
          description: Character position within the line (0-based)